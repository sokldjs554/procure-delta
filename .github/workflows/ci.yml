name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: procure_delta
          POSTGRES_PASSWORD: procure_delta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procure_delta -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://procure_delta:procure_delta@localhost:5432/procure_delta_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://procure_delta:procure_delta@localhost:5432/postgres
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest
      - run: python -m unittest discover -s contract_tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  public-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build the exact public static-demo mode
        run: NEXT_PUBLIC_STATIC_DEMO=true npm run build
      - run: npx playwright install --with-deps chromium
      - name: Public static-demo browser E2E
        run: |
          PORT=3100 npm start > /tmp/procure-delta-static-demo.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/procure-delta-static-demo.log
            exit 1
          fi
          E2E_WEB_URL=http://127.0.0.1:3100 node e2e/static-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procure-delta-public-demo-evidence
          path: artifacts/e2e/static-public

  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isolated containers, migrations, real E2E and benchmarks
        run: python scripts/verify_containers.py --scale-records 1000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procure-delta-release-evidence
          path: |
            artifacts/container
            artifacts/e2e
            artifacts/performance
