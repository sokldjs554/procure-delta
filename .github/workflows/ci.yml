name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: procure_delta
          POSTGRES_PASSWORD: procure_delta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procure_delta -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://procure_delta:procure_delta@localhost:5432/procure_delta_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://procure_delta:procure_delta@localhost:5432/postgres
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Install real Korean and English OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - run: ruff check .
      - run: mypy app
      - run: pytest
      - run: python -m unittest discover -s contract_tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build public static demo
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_DEMO: "true"
      - name: Verify Node standalone serves browser assets
        run: npm run test:standalone
      - name: Install browser and Korean fonts
        run: npx playwright install --with-deps chromium && sudo apt-get install -y fonts-noto-cjk
      - name: Exercise public demo workspace on desktop and mobile
        run: node e2e/demo-workspace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procure-delta-demo-workspace
          path: artifacts/e2e/demo-workspace

  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isolated containers, migrations, real E2E and benchmarks
        # Check actual interpolated configuration; never start or send to test destinations.
        # The full release below uses a separate isolated Compose file.
        run: |
          python scripts/check_compose_environment.py
          python scripts/verify_containers.py --scale-records 1000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procure-delta-release-evidence
          path: |
            artifacts/container
            artifacts/e2e
            artifacts/performance
