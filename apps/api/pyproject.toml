[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "procure-delta-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "psycopg[binary]>=3.2,<4",
  "sentry-sdk[arq,fastapi]>=2.70,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "Pillow>=11,<12",
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
